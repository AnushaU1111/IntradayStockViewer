name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, audit, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Fail on high-severity advisories in production dependencies only.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  test:
    name: Tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Host timezones chosen so date-grouping bugs that depend on the server's
        # zone show up: UTC, UTC+14 (first to see a new day) and a US zone with DST.
        tz: [UTC, Pacific/Kiritimati, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Real-stack e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Both clock scenarios, in sequence, against the built UI and compiled API.
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
